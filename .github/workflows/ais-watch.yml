name: AIS Cadastre watch

# Daily probe for new NOAA Marine Cadastre bulk AIS (csv{YYYY}/ais-*.csv.zst).
# Also refreshes Catch-tab dock totals (fish-report scrape, no AIS required).
#
# Full AIS extract + stop/map rebuild still needs a machine with the local
# parquet archive (gitignored). This workflow detects publication and keeps
# status / Catch data fresh on GitHub Pages.

on:
  schedule:
    # ~08:30 America/Los_Angeles (16:30 UTC winter / 15:30 UTC PDT — pick 15:30)
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      scrape_days:
        description: "How many trailing days of fish reports to refresh"
        required: false
        default: "14"
      skip_scrape:
        description: "Skip fish-report scrape (probe only)"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ais-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Probe is stdlib-only; scrape needs these. Skip duckdb/pandas for the watch job.
          pip install "beautifulsoup4>=4.12" "lxml>=5.0" "requests>=2.31"

      - name: Probe Marine Cadastre availability
        id: cadastre
        run: |
          python3 scripts/check_ais_cadastre.py \
            --out docs/data/ais_cadastre_status.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Refresh recent fish reports + Catch summary
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_scrape != 'true' }}
        env:
          SCRAPE_DAYS: ${{ github.event.inputs.scrape_days || '14' }}
        run: |
          set -euo pipefail
          END=$(python3 - <<'PY'
          from datetime import date
          print(date.today().isoformat())
          PY
          )
          START=$(python3 - <<'PY'
          from datetime import date, timedelta
          import os
          days = max(1, int(os.environ.get("SCRAPE_DAYS", "14")))
          print((date.today() - timedelta(days=days - 1)).isoformat())
          PY
          )
          echo "Scraping fish reports $START → $END"
          python3 scripts/scrape_fish_reports.py --start "$START" --end "$END" --workers 4
          python3 scripts/build_homeport_summary.py
          # Mirror report window end in config note is optional; homeport as_of follows scrape.

      - name: Commit updated status / Catch data
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/ais_cadastre_status.json docs/data/homeport_summary.json || true
          # Yearly fish-report shards if scrape rewrote them
          git add data/raw/fish_reports/by_year/*.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit."
          else
            git commit -m "chore: daily AIS Cadastre watch + Catch refresh"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update issue when new Cadastre coverage appears
        if: ${{ steps.cadastre.outputs.new_coverage == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.cadastre.outputs.latest_published_day }}
          CONFIG_END: ${{ steps.cadastre.outputs.config_ais_end }}
          REC: ${{ steps.cadastre.outputs.recommendation }}
          NEXT_YEAR: ${{ steps.cadastre.outputs.next_year_published }}
        run: |
          set -euo pipefail
          TITLE="Marine Cadastre AIS update available (through ${LATEST:-unknown})"
          BODY=$(cat <<EOF
          ## New Cadastre coverage detected

          - **Latest published day:** \`${LATEST}\`
          - **Config \`PILOT_AIS_END\`:** \`${CONFIG_END}\`
          - **csv next-year published:** \`${NEXT_YEAR}\`
          - **Checked by:** [AIS Cadastre watch](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### Recommended next steps
          ${REC}

          \`\`\`bash
          # On a machine that already has data/processed/ais_daily/:
          python3 scripts/extract_ais.py --start ${CONFIG_END} --end ${LATEST}
          python3 scripts/refine_registry.py
          python3 scripts/detect_stops.py
          python3 scripts/build_map_data.py
          python3 scripts/build_homeport_summary.py
          # bump PILOT_AIS_END in scripts/config.py to ${LATEST}
          \`\`\`

          Prefer Cadastre over overlapping aisstream parquet days once extracted.
          EOF
          )
          # Reuse a single open issue tagged cadastre-watch
          EXISTING=$(gh issue list --label cadastre-watch --state open --json number,title --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            gh issue edit "$EXISTING" --title "$TITLE"
          else
            gh label create cadastre-watch --description "Marine Cadastre bulk AIS availability" --color "0E8A16" 2>/dev/null || true
            gh issue create --title "$TITLE" --label cadastre-watch --body "$BODY"
          fi
